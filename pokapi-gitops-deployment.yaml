apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pokapi
  name: pokapi
spec:
  selector:
    matchLabels:
      app: pokapi
  template:
    metadata:
      labels:
        app: pokapi
    spec:
      containers:
      - image: jinkura/pokapi:d51bf6e
        name: pokapi
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
